<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
<script>
'use strict';

const WORLD_W    = 2400;
const WORLD_H    = 2400;
const PLAYER_SPD = 220;
const BULLET_SPD = 560;
const BULLET_DMG = 20;
const PLAYER_HP  = 100;
const FIRE_RATE  = 180;   // ms between shots
const GRUNT_HP   = 30;
const GRUNT_SPD  = 75;
const GRUNT_DMG  = 8;
const RUNNER_HP  = 15;
const RUNNER_SPD = 165;
const RUNNER_DMG = 5;
const RESPAWN_MS = 3000;
const WAVE_GAP   = 4000;

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    preload() {
        let g;

        // ── Player (48×48, ship pointing RIGHT) ──────────────────────────────
        g = this.make.graphics({ add: false });
        // Outer glow rings
        g.fillStyle(0x1144ff, 0.10); g.fillCircle(24, 24, 24);
        g.fillStyle(0x2255ff, 0.14); g.fillCircle(24, 24, 21);
        g.fillStyle(0x3366ff, 0.18); g.fillCircle(24, 24, 18);
        // Main hull (dark navy polygon)
        g.fillStyle(0x0b1e52, 1);
        g.fillPoints([
            {x:44,y:24},{x:30,y:10},{x:8,y:14},{x:4,y:24},{x:8,y:34},{x:30,y:38}
        ], true);
        // Hull highlight (medium blue)
        g.fillStyle(0x1a4aaa, 1);
        g.fillPoints([
            {x:40,y:24},{x:28,y:13},{x:11,y:17},{x:8,y:24},{x:11,y:31},{x:28,y:35}
        ], true);
        // Engine nozzles (back)
        g.fillStyle(0x0d2a6e, 1);
        g.fillRect(5, 14, 6, 5);
        g.fillRect(5, 29, 6, 5);
        // Engine glow (orange)
        g.fillStyle(0xff6600, 0.9); g.fillCircle(7, 17, 4);
        g.fillStyle(0xff6600, 0.9); g.fillCircle(7, 31, 4);
        g.fillStyle(0xffaa00, 1);   g.fillCircle(6, 17, 2);
        g.fillStyle(0xffaa00, 1);   g.fillCircle(6, 31, 2);
        // Cockpit
        g.fillStyle(0x55aaff, 1);   g.fillCircle(34, 24, 5);
        g.fillStyle(0xaaddff, 1);   g.fillCircle(35, 23, 2);
        // Hull edge
        g.lineStyle(1.5, 0x4488ff, 0.9);
        g.strokePoints([
            {x:44,y:24},{x:30,y:10},{x:8,y:14},{x:4,y:24},{x:8,y:34},{x:30,y:38}
        ], true);
        g.generateTexture('player', 48, 48);
        g.destroy();

        // ── Grunt (40×40, hexagonal robot facing RIGHT) ───────────────────────
        g = this.make.graphics({ add: false });
        // Shadow
        g.fillStyle(0x1a0000, 0.7); g.fillCircle(21, 21, 19);
        // Outer hex body
        g.fillStyle(0x7a0f0f, 1);
        g.fillPoints([
            {x:37,y:20},{x:29,y:6},{x:11,y:6},{x:3,y:20},{x:11,y:34},{x:29,y:34}
        ], true);
        // Inner hex highlight
        g.fillStyle(0xbb2222, 1);
        g.fillPoints([
            {x:32,y:20},{x:25,y:10},{x:15,y:10},{x:8,y:20},{x:15,y:30},{x:25,y:30}
        ], true);
        // Chest plate
        g.fillStyle(0xdd3333, 1);
        g.fillRect(14, 15, 12, 10);
        g.fillStyle(0xff5555, 1);
        g.fillRect(16, 17, 8, 6);
        // Glowing eyes (right side, since it faces right)
        g.fillStyle(0xff0000, 1); g.fillCircle(30, 15, 4);
        g.fillStyle(0xff0000, 1); g.fillCircle(30, 25, 4);
        g.fillStyle(0xff8888, 1); g.fillCircle(31, 14, 2);
        g.fillStyle(0xff8888, 1); g.fillCircle(31, 24, 2);
        // Eye glow
        g.fillStyle(0xff0000, 0.3); g.fillCircle(30, 15, 6);
        g.fillStyle(0xff0000, 0.3); g.fillCircle(30, 25, 6);
        // Edge
        g.lineStyle(1.5, 0xff4444, 0.8);
        g.strokePoints([
            {x:37,y:20},{x:29,y:6},{x:11,y:6},{x:3,y:20},{x:11,y:34},{x:29,y:34}
        ], true);
        g.generateTexture('grunt', 40, 40);
        g.destroy();

        // ── Runner (40×40, sleek diamond facing RIGHT) ────────────────────────
        g = this.make.graphics({ add: false });
        // Outer glow
        g.fillStyle(0xff5500, 0.12); g.fillCircle(20, 20, 20);
        g.fillStyle(0xff6600, 0.18); g.fillCircle(20, 20, 16);
        // Outer diamond (deep orange)
        g.fillStyle(0x992200, 1);
        g.fillPoints([{x:38,y:20},{x:20,y:5},{x:2,y:20},{x:20,y:35}], true);
        // Mid diamond (bright orange)
        g.fillStyle(0xff6600, 1);
        g.fillPoints([{x:33,y:20},{x:20,y:9},{x:7,y:20},{x:20,y:31}], true);
        // Inner diamond (yellow-orange)
        g.fillStyle(0xff9900, 1);
        g.fillPoints([{x:27,y:20},{x:20,y:13},{x:13,y:20},{x:20,y:27}], true);
        // Bright core
        g.fillStyle(0xffcc00, 1); g.fillCircle(22, 20, 4);
        g.fillStyle(0xffee88, 1); g.fillCircle(23, 19, 2);
        // Speed stripes (back half)
        g.lineStyle(1, 0xff8800, 0.6);
        g.lineBetween(2, 20, 10, 15);
        g.lineBetween(2, 20, 10, 25);
        // Edge
        g.lineStyle(1.5, 0xffaa00, 0.9);
        g.strokePoints([{x:38,y:20},{x:20,y:5},{x:2,y:20},{x:20,y:35}], true);
        g.generateTexture('runner', 40, 40);
        g.destroy();

        // ── Bullet (12×12, glowing plasma shot) ──────────────────────────────
        g = this.make.graphics({ add: false });
        g.fillStyle(0xff8800, 0.20); g.fillCircle(6, 6, 6);
        g.fillStyle(0xffcc00, 0.45); g.fillCircle(6, 6, 4);
        g.fillStyle(0xffee00, 1);    g.fillCircle(6, 6, 2.5);
        g.fillStyle(0xffffff, 1);    g.fillCircle(6, 6, 1);
        g.generateTexture('bullet', 12, 12);
        g.destroy();
    }

    create() {
        // --- World background ---
        const bg = this.add.graphics();
        bg.fillStyle(0x06060f, 1);
        bg.fillRect(0, 0, WORLD_W, WORLD_H);
        // Major grid lines (every 160px)
        bg.lineStyle(1, 0x1a1a40, 1);
        for (let x = 0; x <= WORLD_W; x += 160) bg.lineBetween(x, 0, x, WORLD_H);
        for (let y = 0; y <= WORLD_H; y += 160) bg.lineBetween(0, y, WORLD_W, y);
        // Minor grid lines (every 80px)
        bg.lineStyle(1, 0x0e0e28, 1);
        for (let x = 80; x < WORLD_W; x += 160) bg.lineBetween(x, 0, x, WORLD_H);
        for (let y = 80; y < WORLD_H; y += 160) bg.lineBetween(0, y, WORLD_W, y);
        // Intersection dots on major grid
        bg.fillStyle(0x222255, 1);
        for (let x = 0; x <= WORLD_W; x += 160) {
            for (let y = 0; y <= WORLD_H; y += 160) {
                bg.fillRect(x - 1, y - 1, 2, 2);
            }
        }
        // World border glow (layered)
        bg.lineStyle(6, 0x112288, 0.3); bg.strokeRect(0, 0, WORLD_W, WORLD_H);
        bg.lineStyle(3, 0x2244cc, 0.7); bg.strokeRect(2, 2, WORLD_W - 4, WORLD_H - 4);
        bg.lineStyle(1, 0x4477ff, 1);   bg.strokeRect(4, 4, WORLD_W - 8, WORLD_H - 8);

        this.physics.world.setBounds(0, 0, WORLD_W, WORLD_H);

        // --- Player ---
        this.player = this.physics.add.sprite(WORLD_W / 2, WORLD_H / 2, 'player');
        this.player.setCollideWorldBounds(true);
        this.player.setDepth(10);
        this.player.body.setCircle(16, 8, 8); // circular hitbox (radius, offsetX, offsetY)
        this.player.hp     = PLAYER_HP;
        this.player.alive  = true;
        this.player.lastFired = 0;

        // --- Camera ---
        this.cameras.main
            .setBounds(0, 0, WORLD_W, WORLD_H)
            .startFollow(this.player, true, 0.12, 0.12);

        // --- Groups ---
        this.bullets = this.physics.add.group();
        this.enemies = this.physics.add.group();

        // --- Overlaps ---
        this.physics.add.overlap(this.bullets, this.enemies, this.onBulletHit, null, this);
        this.physics.add.overlap(this.player,  this.enemies, this.onPlayerHit, null, this);

        // --- Game state ---
        this.wave      = 0;
        this.kills     = 0;
        this.waveActive = false;
        this.mouseDown  = false;

        // --- Input ---
        this.keys = this.input.keyboard.addKeys('W,A,S,D,UP,LEFT,DOWN,RIGHT');
        this.input.mouse.disableContextMenu();
        this.input.on('pointerdown', (p) => { if (p.leftButtonDown()) this.mouseDown = true; });
        this.input.on('pointerup',   ()  => { this.mouseDown = false; });

        // --- HUD (setScrollFactor(0) pins to screen) ---
        const ts = (col) => ({
            fontFamily: 'monospace', fontSize: '18px', color: col,
            stroke: '#000000', strokeThickness: 3
        });
        this.hudWave  = this.add.text(12,  12, 'Wave 1',   ts('#ffffff')).setScrollFactor(0).setDepth(50);
        this.hudKills = this.add.text(12,  40, 'Kills: 0', ts('#aaaaee')).setScrollFactor(0).setDepth(50);
        this.hudHP    = this.add.text(12,  68, 'HP: 100',  ts('#44ff88')).setScrollFactor(0).setDepth(50);
        this.hudMsg   = this.add.text(400, 300, '', {
            fontFamily: 'monospace', fontSize: '34px', color: '#ffff00',
            stroke: '#000000', strokeThickness: 5
        }).setScrollFactor(0).setDepth(50).setOrigin(0.5);

        // HP bar (drawn each frame in updateHPBar)
        this.hpBarBg = this.add.graphics().setScrollFactor(0).setDepth(49);
        this.hpBarFg = this.add.graphics().setScrollFactor(0).setDepth(50);
        this.updateHPBar();

        // --- Controls hint ---
        this.add.text(12, this.scale.height - 24, 'WASD: Move   Mouse: Aim   Click: Shoot', {
            fontFamily: 'monospace', fontSize: '12px', color: '#555577'
        }).setScrollFactor(0).setDepth(50);

        // Start first wave
        this.time.delayedCall(600, () => this.startWave(), [], this);
    }

    // ── Wave management ──────────────────────────────────────────────────────

    startWave() {
        this.wave++;
        this.waveActive = true;

        const total   = 5 + this.wave * 3;
        const runners = this.wave >= 3 ? Math.floor(total * 0.3) : 0;
        for (let i = 0; i < runners;           i++) this.spawnEnemy('runner');
        for (let i = 0; i < total - runners;   i++) this.spawnEnemy('grunt');

        this.hudWave.setText(`Wave ${this.wave}`);
        this.flashMsg(`Wave ${this.wave}!`, '#ffff44', 1500);
    }

    spawnEnemy(type) {
        const margin = 50;
        const side   = Phaser.Math.Between(0, 3);
        let x, y;
        switch (side) {
            case 0: x = Phaser.Math.Between(margin, WORLD_W - margin); y = margin;             break;
            case 1: x = Phaser.Math.Between(margin, WORLD_W - margin); y = WORLD_H - margin;   break;
            case 2: x = margin;            y = Phaser.Math.Between(margin, WORLD_H - margin);  break;
            default: x = WORLD_W - margin; y = Phaser.Math.Between(margin, WORLD_H - margin);
        }

        const e = this.enemies.create(x, y, type);
        e.setDepth(5);
        e.etype  = type;
        e.hp     = type === 'grunt' ? GRUNT_HP  : RUNNER_HP;
        e.maxHp  = e.hp;
        e.spd    = type === 'grunt' ? GRUNT_SPD : RUNNER_SPD;
        e.dmg    = type === 'grunt' ? GRUNT_DMG : RUNNER_DMG;
        e.hitCd  = 0;
        e.body.allowGravity = false;
        e.body.setCircle(14, 6, 6); // circular hitbox
        e.hpBar  = this.add.graphics().setDepth(6);
        return e;
    }

    // ── Shooting ─────────────────────────────────────────────────────────────

    shoot() {
        const now = this.time.now;
        if (now - this.player.lastFired < FIRE_RATE) return;
        this.player.lastFired = now;

        const ptr = this.input.activePointer;
        const ang = Phaser.Math.Angle.Between(
            this.player.x, this.player.y,
            ptr.worldX, ptr.worldY
        );

        const b = this.bullets.create(this.player.x, this.player.y, 'bullet');
        b.setDepth(8);
        b.body.allowGravity = false;
        b.setVelocity(Math.cos(ang) * BULLET_SPD, Math.sin(ang) * BULLET_SPD);
        b.ttl = 1600;
    }

    // ── Collision callbacks ───────────────────────────────────────────────────

    onBulletHit(bullet, enemy) {
        bullet.disableBody(true, true);

        enemy.hp -= BULLET_DMG;
        this.tweens.add({ targets: enemy, alpha: 0.15, duration: 60, yoyo: true });

        if (enemy.hp <= 0) this.killEnemy(enemy);
    }

    killEnemy(enemy) {
        this.kills++;
        this.hudKills.setText(`Kills: ${this.kills}`);

        // Explosion flash
        const col   = enemy.etype === 'grunt' ? 0xff4422 : 0xff8800;
        const flash = this.add.graphics().setDepth(15);
        flash.fillStyle(col, 0.9);
        flash.fillCircle(enemy.x, enemy.y, 22);
        this.tweens.add({
            targets: flash, alpha: 0, scaleX: 3, scaleY: 3, duration: 350,
            onComplete: () => flash.destroy()
        });

        if (enemy.hpBar) enemy.hpBar.destroy();
        enemy.destroy();

        // Check wave clear
        if (this.enemies.countActive(true) === 0 && this.waveActive) {
            this.waveActive = false;
            this.flashMsg('Wave Clear!', '#44ff88', WAVE_GAP - 500);
            this.time.delayedCall(WAVE_GAP, () => this.startWave(), [], this);
        }
    }

    onPlayerHit(player, enemy) {
        if (!player.alive) return;
        const now = this.time.now;
        if (now < enemy.hitCd) return;
        enemy.hitCd = now + 600;

        player.hp -= enemy.dmg;
        this.updateHPBar();
        const pct = player.hp / PLAYER_HP;
        const col = pct > 0.5 ? '#44ff88' : pct > 0.25 ? '#ffaa00' : '#ff4444';
        this.hudHP.setText(`HP: ${Math.max(0, player.hp)}`).setStyle({ color: col });
        this.cameras.main.shake(100, 0.008);

        if (player.hp <= 0) this.playerDie();
    }

    playerDie() {
        this.player.alive = false;
        this.player.setActive(false).setVisible(false).setVelocity(0, 0);
        this.flashMsg('DEAD — Respawning...', '#ff4444', RESPAWN_MS);
        this.time.delayedCall(RESPAWN_MS, () => this.respawn(), [], this);
    }

    respawn() {
        this.player.hp = PLAYER_HP;
        this.player.alive = true;
        this.player.setActive(true).setVisible(true);
        this.player.setPosition(WORLD_W / 2, WORLD_H / 2);
        this.updateHPBar();
        this.hudHP.setText(`HP: ${PLAYER_HP}`).setStyle({ color: '#44ff88' });
    }

    // ── HUD helpers ──────────────────────────────────────────────────────────

    updateHPBar() {
        const w = 200, h = 14, x = 12, y = 96;
        this.hpBarBg.clear();
        this.hpBarBg.fillStyle(0x333344, 1);
        this.hpBarBg.fillRect(x, y, w, h);

        const pct = Math.max(0, this.player.hp / PLAYER_HP);
        const col = pct > 0.5 ? 0x44ff88 : pct > 0.25 ? 0xffaa00 : 0xff4444;
        this.hpBarFg.clear();
        this.hpBarFg.fillStyle(col, 1);
        this.hpBarFg.fillRect(x, y, w * pct, h);
    }

    flashMsg(text, color, duration) {
        this.hudMsg.setText(text).setStyle({ color });
        if (this._msgTimer) this._msgTimer.remove();
        this._msgTimer = this.time.delayedCall(duration, () => this.hudMsg.setText(''), [], this);
    }

    // ── Main update loop ─────────────────────────────────────────────────────

    update(time, delta) {
        // Player movement + aim
        if (this.player.alive) {
            let vx = 0, vy = 0;
            if (this.keys.A.isDown || this.keys.LEFT.isDown)  vx -= PLAYER_SPD;
            if (this.keys.D.isDown || this.keys.RIGHT.isDown) vx += PLAYER_SPD;
            if (this.keys.W.isDown || this.keys.UP.isDown)    vy -= PLAYER_SPD;
            if (this.keys.S.isDown || this.keys.DOWN.isDown)  vy += PLAYER_SPD;
            if (vx !== 0 && vy !== 0) { vx *= 0.7071; vy *= 0.7071; }
            this.player.setVelocity(vx, vy);

            const ptr = this.input.activePointer;
            this.player.setRotation(
                Phaser.Math.Angle.Between(this.player.x, this.player.y, ptr.worldX, ptr.worldY)
            );

            if (this.mouseDown) this.shoot();
        }

        // Bullet lifetime — collect spent bullets then destroy
        const spent = [];
        this.bullets.getChildren().forEach(b => {
            if (!b.active) { spent.push(b); return; }
            b.ttl -= delta;
            if (b.ttl <= 0) b.disableBody(true, true);
        });
        spent.forEach(b => b.destroy());

        // Enemy AI + HP bars
        const tx = this.player.x, ty = this.player.y;
        this.enemies.getChildren().forEach(e => {
            if (!e.active) return;
            const ang = Phaser.Math.Angle.Between(e.x, e.y, tx, ty);
            e.setVelocity(Math.cos(ang) * e.spd, Math.sin(ang) * e.spd);
            e.setRotation(ang);

            if (e.hpBar) {
                e.hpBar.clear();
                const bw = 36, bh = 5, bx = e.x - 18, by = e.y - 28;
                e.hpBar.fillStyle(0x111122, 1);
                e.hpBar.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
                e.hpBar.fillStyle(0x222233, 1);
                e.hpBar.fillRect(bx, by, bw, bh);
                e.hpBar.fillStyle(e.etype === 'grunt' ? 0xff3333 : 0xff8800, 1);
                e.hpBar.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
            }
        });
    }
}

new Phaser.Game({
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: '#08081a',
    physics: {
        default: 'arcade',
        arcade: { gravity: { x: 0, y: 0 }, debug: false }
    },
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: GameScene
});
</script>
</body>
</html>
